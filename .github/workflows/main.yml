name: Update profile visuals
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/profile-visuals.mjs
      - scripts/profile-visuals.test.mjs
      - .github/workflows/main.yml

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Validate renderer
        run: node --test scripts/profile-visuals.test.mjs
      - name: Render profile visuals
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/profile-visuals.mjs
      - name: Commit updated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/toolkit.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh profile visuals"
          git push
